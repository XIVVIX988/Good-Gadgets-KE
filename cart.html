<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your Bag | Good Gadgets KE
    </title>
    <link rel="stylesheet" href="CSS/styles.css">
    <script defer src="Javascript/app.js">
    </script>
  </head>
  <body data-page="">
    <div id="site-header">
    </div>
    <main class="container cart-page">
      <div class="breadcrumb">
        <a href="index.html">Home
        </a>
         / Your bag
      </div>
      <h1 style="font:800 30px Manrope;letter-spacing:-1px">Your bag
      </h1>
      <p style="font-size:11px;color:#888">Demo cart preview. Checkout and payment are not connected.
      </p>
      <div id="cart-items">
      </div>
      <div class="cart-summary" id="cart-summary" hidden>
        <div class="summary-line"><span>Sample subtotal</span><strong id="cart-subtotal"></strong>
        </div>
        <div class="summary-line"><span>Delivery</span><span>To be confirmed</span>
        </div>
        <div class="summary-line summary-total"><span>Estimated total</span><strong id="cart-subtotal-copy"></strong>
        </div>
        <button class="btn btn-primary" data-checkout style="width:100%;margin-top:10px">Continue to checkout
        </button>
        <small style="display:block;margin-top:10px;color:#888;font-size:9px;line-height:1.5">Sample prices only. Checkout requires confirmed products, delivery rules and payment setup.</small>
      </div>
    </main>
    <div id="site-footer">
    </div>
  </body>
</html>
