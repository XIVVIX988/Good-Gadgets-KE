<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Browse the Good Gadgets KE demo catalogue.">
    <title>Shop | Good Gadgets KE
    </title>
    <link rel="stylesheet" href="CSS/styles.css">
    <script defer src="Javascript/app.js">
    </script>
  </head>
  <body data-page="shop">
    <div id="site-header">
    </div>
    <main>
      <div class="container shop-layout">
        <aside class="filters">
          <div class="filter-head">Filter products
          </div>
          <div class="filter-group">
            <h4>Category
            </h4>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Phones"> Phones
            </label>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Laptops"> Laptops
            </label>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Audio"> Audio
            </label>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Smart Devices"> Smart devices
            </label>
          </div>
        </aside>
        <section>
          <div class="shop-toolbar">
            <p id="result-count">Loading products
            </p>
            <select id="sort-products" aria-label="Sort products">
              <option value="featured">Featured
              </option>
              <option value="low">Price: low to high
              </option>
              <option value="high">Price: high to low
              </option>
            </select>
          </div>
          <input id="shop-search" placeholder="Search demo products" style="width:100%;height:38px;border:1px solid #e5e5e5;border-radius:5px;padding:0 12px;margin:0 0 16px;font-size:14px" aria-label="Search demo products">
          <div class="product-grid shop-products" id="shop-products">
          </div>
          <p style="font-size:13px;color:#888;margin-top:16px">Sample listings are for preview only. Confirm product data, pricing, stock and terms before publishing.
          </p>
        </section>
      </div>
    </main>
    <div id="site-footer">
    </div>
  </body>
</html>
