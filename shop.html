<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="Assets/good-gadgets-favicon.svg">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Browse the Good Gadgets KE demo catalogue.">
    <title>Shop | Good Gadgets KE
    </title>
    <link rel="stylesheet" href="CSS/styles.css?v=whatsapp-compact-20261029">
    <script defer src="Javascript/app.js?v=whatsapp-compact-20261029">
    </script>
  </head>
  <body data-page="shop">
    <div id="site-header">
    </div>
    <main>
      <div class="container shop-layout">
        <aside class="filters" aria-label="Product filters">
          <div class="filter-section">
            <h2>Categories</h2>
            <label class="filter-option"><input type="checkbox" name="category-filter" value=""> All Products</label>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Phones"> Phones</label>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Laptops"> Laptops</label>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Audio"> Audio</label>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Accessories"> Accessories</label>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Smart Devices"> Smart Devices</label>
            <label class="filter-option"><input type="checkbox" name="category-filter" value="Deals"> Deals</label>
          </div>
          <div class="filter-section">
            <h2>Filter by Brand</h2>
            <label class="filter-option"><input type="checkbox"> Apple</label>
            <label class="filter-option"><input type="checkbox"> Samsung</label>
            <label class="filter-option"><input type="checkbox"> Infinix</label>
            <label class="filter-option"><input type="checkbox"> Xiaomi</label>
            <label class="filter-option"><input type="checkbox"> Tecno</label>
            <label class="filter-option"><input type="checkbox"> OPPO</label>
            <label class="filter-option"><input type="checkbox"> vivo</label>
            <label class="filter-option"><input type="checkbox"> Huawei</label>
            <label class="filter-option"><input type="checkbox"> Redmi</label>
            <label class="filter-option"><input type="checkbox"> HP</label>
            <label class="filter-option"><input type="checkbox"> Dell</label>
            <label class="filter-option"><input type="checkbox"> Lenovo</label>
            <label class="filter-option"><input type="checkbox"> ASUS</label>
            <label class="filter-option"><input type="checkbox"> Acer</label>
            <label class="filter-option"><input type="checkbox"> JBL</label>
            <label class="filter-option"><input type="checkbox"> Sony</label>
            <label class="filter-option"><input type="checkbox"> Oraimo</label>
          </div>
          <div class="filter-section">
            <h2>Price Range</h2>
            <label class="filter-option"><input type="checkbox" name="price-filter" value="0-25000"> KSh 0 - 25,000</label>
            <label class="filter-option"><input type="checkbox" name="price-filter" value="25000-50000"> KSh 25,000 - 50,000</label>
            <label class="filter-option"><input type="checkbox" name="price-filter" value="50000-100000"> KSh 50,000 - 100,000</label>
            <label class="filter-option"><input type="checkbox" name="price-filter" value="100000-"> KSh 100,000+</label>
          </div>
          <div class="filter-section">
            <h2>Availability</h2>
            <label class="filter-option"><input type="checkbox"> In Stock</label>
            <label class="filter-option"><input type="checkbox"> Out of Stock</label>
          </div>
        </aside>
        <section class="shop-results" aria-label="Product listings">
          <div class="shop-heading">
            <div>
              <h1 id="category-title">All Products</h1>
              <p id="category-subtitle">Browse the latest gadgets from Good Gadgets KE.</p>
            </div>
            <label class="sort-control">Sort by
              <select id="sort-products" aria-label="Sort products">
                <option value="featured">Newest</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
              </select>
            </label>
          </div>
          <div class="shop-toolbar">
            <p id="result-count">Loading products</p>
            <input id="shop-search" placeholder="Search products" aria-label="Search products">
          </div>
          <div class="product-grid shop-products" id="shop-products"></div>
          <p class="shop-disclaimer">Sample listings are for preview only. Confirm product data, pricing, stock and terms before publishing.</p>
        </section>
      </div>
    </main>
    <div id="site-footer">
    </div>
  </body>
</html>
